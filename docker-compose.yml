version: '3.8'

services:
  ai-road-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_road_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TORCH_NUM_THREADS=4
      - OMP_NUM_THREADS=4
      - WORKERS=2
    volumes:
      # Mount cache định cỡ đường và vạch đếm xe
      - ./road_segmentation/cache:/app/road_segmentation/cache
      # Mount weights từ máy chủ vào container (tránh mất file khi rebuild)
      - ./weights:/app/weights
      # Mount thư mục xuất video/ảnh kết quả
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/calibration/summary"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
